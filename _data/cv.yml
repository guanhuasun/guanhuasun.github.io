# Structured CV data — rendered by _pages/cv.md.

research_areas: >
  I work at the intersection of applied mathematics and computational neuroscience,
  developing data-driven and mechanistic models of brain-wide neural and cerebrovascular
  dynamics. I integrate connectomics and spatial transcriptomics with large-scale
  simulation to investigate how network structure and neuronal dynamics shape collective
  brain activity. Building on my background in scientific computing and fluid-structure
  interaction, I study how neural activity couples to vascular signaling and blood flow
  to understand the mechanisms of physiological regulation in the brain.

