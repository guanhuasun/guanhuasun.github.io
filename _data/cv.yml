# Structured CV data — rendered by _pages/cv.md.

interests: >
  My current research focuses on large-scale simulation of the mouse brain,
  where I use advanced computational techniques to explore how network connectivity
  and neuronal dynamics influence the collective behavior of the cortical network.
  Prior to neuroscience, I worked on fluid-structure interaction problems in physics
  and physiology. Besides research, I'm the co-founder of Veritas China (2015–),
  the largest student-run non-profit organization that aims to promote liberal arts
  education in China.

